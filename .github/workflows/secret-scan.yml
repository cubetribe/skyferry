name: secret-scan

# Keeps secrets out of this public repo: scans the full git history on every
# push and pull request. "gitleaks" is a required status check for main.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks (pinned, SHA256-verified)
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" gitleaks
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Choose rules (a pull request cannot loosen its own scan)
        run: |
          set -euo pipefail
          cfg="$RUNNER_TEMP/gitleaks.toml"
          if [ -n "${GITHUB_BASE_REF:-}" ] && git show "origin/${GITHUB_BASE_REF}:.gitleaks.toml" > "$cfg" 2>/dev/null; then
            echo "Using .gitleaks.toml from base branch ${GITHUB_BASE_REF}"
          else
            cp .gitleaks.toml "$cfg"
            echo "Using .gitleaks.toml from this commit"
          fi
          echo "GITLEAKS_CFG=$cfg" >> "$GITHUB_ENV"

      - name: Self-test - every project rule must catch its planted canary
        run: |
          set -euo pipefail
          c="$RUNNER_TEMP/canary"
          mkdir -p "$c"
          # Canaries are generated at runtime, so this file never matches itself.
          check() {  # $1 = rule id that must fire, $2 = file content
            local d="$c/$1" rc=0
            mkdir -p "$d"
            printf '%s\n' "$2" > "$d/config.toml"
            gitleaks dir "$d" --config "$GITLEAKS_CFG" --no-banner --redact --exit-code 42 \
              --report-format json --report-path "$c/$1.json" > /dev/null 2>&1 || rc=$?
            if [ "$rc" -ne 42 ]; then
              echo "::error::canary $1: expected exit 42 (leak found), got $rc"; exit 1
            fi
            if ! grep -Eq "\"RuleID\": *\"$1\"" "$c/$1.json"; then
              echo "::error::canary $1: gitleaks ran but rule '$1' did not fire"; exit 1
            fi
            echo "canary $1: detected"
          }
          check healthchecks-ping-url      "healthchecks_url = \"https://hc-ping.com/$(cat /proc/sys/kernel/random/uuid)\""
          check healthchecks-ping-key-url  "healthchecks_url = \"https://hc-ping.com/$(openssl rand -hex 11)/skyferry\""
          check ntfy-topic-url             "ntfy_url = \"https://ntfy.sh/$(openssl rand -hex 12)\""
          check rclone-oauth-token         "token = {\"access_token\":\"$(openssl rand -hex 20)\",\"refresh_token\":\"$(openssl rand -hex 20)\"}"
          check google-oauth-client-secret "client_secret = GOCSPX-$(openssl rand -hex 14)"

          # Negative control: a clean file must pass, which proves the exit-code mapping.
          mkdir -p "$c/clean"
          printf 'ntfy_url = ""\nhealthchecks_url = ""\n' > "$c/clean/config.toml"
          rc=0
          gitleaks dir "$c/clean" --config "$GITLEAKS_CFG" --no-banner --exit-code 42 > /dev/null 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::negative control: expected exit 0, got $rc"; exit 1
          fi
          echo "negative control: clean"

      - name: Scan entire git history
        run: |
          rc=0
          gitleaks git . --config "$GITLEAKS_CFG" --no-banner --redact --verbose --exit-code 42 || rc=$?
          case "$rc" in
            0)  echo "No leaks found." ;;
            42) echo "::error::Possible secret in the git history - see the findings above. Remove it and rotate it."; exit 1 ;;
            *)  echo "::error::gitleaks failed to run (exit $rc)"; exit 1 ;;
          esac
